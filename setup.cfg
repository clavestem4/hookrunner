[metadata]
name = hookrunner
version = 0.1.0
author = hookrunner contributors
description = Lightweight Git hook manager that supports shareable hook configs across teams
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/example/hookrunner
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Topic :: Software Development :: Version Control :: Git

[options]
packages = hookrunner
python_requires = >=3.8
install_requires =
    PyYAML>=6.0

[options.entry_points]
console_scripts =
    hookrunner = hookrunner.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0

[tool:pytest]
testpaths = tests
addopts = --tb=short

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist
