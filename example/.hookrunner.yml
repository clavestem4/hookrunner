# Example hookrunner configuration with filter support

shared:
  - https://example.com/team-hooks.yml  # optional remote shared config

env:
  NODE_ENV: development

hooks:
  pre-commit:
    filter:
      branches:
        - main
        - "release/*"
      files:
        - "*.py"
        - "*.js"
      env:
        CI: "false"
    commands:
      - flake8 .
      - pytest --tb=short

  commit-msg:
    commands:
      - python scripts/check_commit_msg.py "$1"

  pre-push:
    filter:
      branches:
        - main
    retry:
      attempts: 2
      delay: 1
    commands:
      - pytest --tb=short
      - mypy hookrunner/
