# Example hookrunner configuration
# Demonstrates per-hook retry settings alongside standard command lists.

shared:
  - ./shared-hooks.yml

hooks:
  pre-commit:
    retry_attempts: 2
    retry_delay: 0.5
    retry_backoff: 1.0
    commands:
      - run: flake8 .
        label: "Lint with flake8"
      - run: mypy hookrunner
        label: "Type-check with mypy"

  pre-push:
    retry_attempts: 3
    retry_delay: 1.0
    retry_backoff: 2.0
    commands:
      - run: pytest --tb=short
        label: "Run test suite"

  commit-msg:
    commands:
      - run: python scripts/check_commit_msg.py "$1"
        label: "Validate commit message format"
